name: Secrets and Trivy

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Monday 06:47 UTC.
    - cron: "47 6 * * 1"

# Jobs below set their own permissions. The workflow token starts with none.
permissions: {}

jobs:
  scan:
    name: Gitleaks and Trivy
    runs-on: ubuntu-latest
    # Report-only for the first round. Remove continue-on-error here and on
    # the Gitleaks and Trivy scan steps after the findings are triaged, then
    # make this job required. The SBOM steps still run because the scan steps
    # set continue-on-error as well.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          work="${RUNNER_TEMP}/gitleaks-install"
          mkdir -p "${work}/bin"
          curl --silent --show-error --fail --location --retry 3 --retry-delay 2 \
            --output "${work}/${archive}" \
            "${url}"
          echo "${checksum}  ${work}/${archive}" | sha256sum --check -
          tar --extract --gzip --file "${work}/${archive}" --directory "${work}/bin" gitleaks
          chmod 0755 "${work}/bin/gitleaks"
          echo "${work}/bin" >> "${GITHUB_PATH}"
          "${work}/bin/gitleaks" version

      - name: Gitleaks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # --redact keeps secret values out of the log. Full git history is
          # scanned because checkout uses fetch-depth 0. No .gitleaks.toml is
          # present, so Gitleaks uses its built-in rules.
          gitleaks detect \
            --source "${GITHUB_WORKSPACE}" \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1

      - name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          # Skip the cache action so this job does not need a cache write.
          cache: "false"
          version: v0.70.0

      - name: Trivy CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          list-all-pkgs: "true"
          cache: "false"
          version: v0.70.0

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json
          if-no-files-found: error
