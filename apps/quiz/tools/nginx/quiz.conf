absolute_redirect off;
index index.html;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
location = /healthz { access_log off; return 200 "ok"; }
location / { try_files $uri $uri/ $uri.html =404; }
location /_next/static/ { add_header Cache-Control $ga_cache always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always; add_header X-Frame-Options "SAMEORIGIN" always; }
error_page 404 /404.html;
location = /404.html { internal; }
