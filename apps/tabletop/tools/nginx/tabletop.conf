absolute_redirect off;
index index.html;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-dTRjD5Z0yVrwUDXrvVA8+i2On69dTzo//JfFn1oB0+Q=' 'sha256-zpQtcD5QSmeHE4QMr/o1E/GIVcJtawmsWluGWIeJQZY=' 'sha256-OAj63jDlL0qiys7rLA9IgeTijN8Japej6r+A0qA8er0=' 'sha256-qPHN0nD2Lp+A3aPTnvTSyUeaOQhSVPxhYh7JfduVhfA=' 'sha256-K6pElk9tQXj7yBRx80/+EWHrfLNGkGhSP7IRfW9eLRA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
location = /healthz { access_log off; return 200 "ok"; }
location ~ ^/(?!index\.html$)(.+)\.html$ { return 301 /$1$is_args$args; }
