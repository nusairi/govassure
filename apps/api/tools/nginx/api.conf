absolute_redirect off;
index index.html;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'none';" always;
location = /healthz { access_log off; return 200 "ok"; }
location ~ ^/(?!index\.html$)(.+)\.html$ { return 301 /$1$is_args$args; }
location / { try_files $uri $uri.html $uri/ =404; }
error_page 404 /ga-404.html;
location = /ga-404.html { internal; }
